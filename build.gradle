plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '7.2.1' apply false
}

ext {
    archUnitVersion = '1.5.0'
    spockVersion = '2.4-M4-groovy-4.0'
    testcontainersVersion = '2.0.5'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def spotlessRatchetReference = providers.gradleProperty('spotlessRatchetFrom')
        .orElse('develop')

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    group = 'ru.sultanyarov'
    version = providers.gradleProperty('releaseVersion').orElse('1.0.0-SNAPSHOT').get()

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.16"
            mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    spotless {
        ratchetFrom spotlessRatchetReference.get()
        java {
            target 'src/**/*.java'
            googleJavaFormat('1.24.0')
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    test {
        useJUnitPlatform()
    }
}
