services:
  postgres:
    image: "postgres:17"
    environment:
      POSTGRES_DB: configurator
      POSTGRES_USER: configurator
      POSTGRES_PASSWORD: configurator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U configurator -d configurator"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: "quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: ${JAR_FILE:-configurator/build/libs/configurator.jar}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/configurator
      DB_USER: configurator
      DB_PASSWORD: configurator
      IMAGE_STORAGE_ENDPOINT: http://minio:9000
      IMAGE_STORAGE_ACCESS_KEY: minioadmin
      IMAGE_STORAGE_SECRET_KEY: minioadmin
      IMAGE_STORAGE_BUCKET: configurator-components

  gateway:
    image: configurator-web:local
    build:
      context: configurator-web
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

volumes:
  postgres_data:
  minio_data:
