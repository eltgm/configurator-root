name: Prepare GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/eltgm/configurator-app
  GATEWAY_IMAGE: ghcr.io/eltgm/configurator-web

jobs:
  verify-release-candidate:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      created: ${{ steps.release.outputs.created }}
      short-sha: ${{ steps.release.outputs.short_sha }}
      version: ${{ steps.release.outputs.version }}
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: configurator-web/package-lock.json

      - name: Validate tag and release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: ${tag}" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${tag}")" != tag ]]; then
            echo "Release tag must be annotated: ${tag}" >&2
            exit 1
          fi
          git fetch origin master
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master
          version="${tag#v}"
          grep -Fq "## [${version}]" CHANGELOG.md || {
            echo "CHANGELOG.md has no release section for ${version}" >&2
            exit 1
          }
          echo "created=$(git show -s --format=%cI "${GITHUB_SHA}")" >>"${GITHUB_OUTPUT}"
          echo "short_sha=${GITHUB_SHA:0:12}" >>"${GITHUB_OUTPUT}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Install frontend dependencies
        working-directory: configurator-web
        run: npm ci

      - name: Run frontend static and unit quality gates
        working-directory: configurator-web
        run: |
          npm run check
          npm run test:coverage

      - name: Build and verify backend and local contracts
        run: >-
          ./gradlew --no-daemon clean build
          -PreleaseVersion=${{ steps.release.outputs.version }}
          -PspotlessRatchetFrom=origin/develop

      - name: Verify release and delivery contracts
        run: |
          delivery/tests/package-contract.sh
          delivery/tests/macos-scripts-test.sh
          delivery/tests/archive-contract.sh
          delivery/tests/release-assets-contract.sh
          delivery/tests/release-workflow-contract.sh

      - name: Install release browsers
        working-directory: configurator-web
        run: npx playwright install --with-deps

      - name: Run frontend browser quality gates
        working-directory: configurator-web
        run: |
          npm run test:e2e
          npm run test:accessibility
          npm run test:visual

      - name: Start release candidate environment
        env:
          JAR_FILE: configurator/build/libs/configurator.jar
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

      - name: Wait for release candidate API
        run: >-
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors
          http://127.0.0.1:8080/api/v3/api-docs >/dev/null

      - name: Run external integration contracts
        run: >-
          ./gradlew --no-daemon :configurator-integration-tests:externalIntegrationTest
          -PreleaseVersion=${{ steps.release.outputs.version }}

      - name: Run production gateway browser smoke
        working-directory: configurator-web
        run: npm run test:delivery

      - name: Tag release candidate images for packaged lifecycle
        run: |
          docker tag "$(docker compose -f docker-compose.yml -f docker-compose.dev.yml images -q app)" configurator-app:release-candidate
          docker tag "$(docker compose -f docker-compose.yml -f docker-compose.dev.yml images -q gateway)" configurator-web:release-candidate

      - name: Print service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color

      - name: Stop release candidate environment
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down --volumes

      - name: Run packaged lifecycle contract
        if: success()
        env:
          CONFIGURATOR_TEST_APP_IMAGE: configurator-app:release-candidate
          CONFIGURATOR_TEST_GATEWAY_IMAGE: configurator-web:release-candidate
        run: delivery/tests/docker-lifecycle-contract.sh

      - name: Upload verified release JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-jar
          path: configurator/build/libs/configurator.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
            configurator-web/playwright-report/
            configurator-web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish-app-image:
    name: Publish backend image
    needs: verify-release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified release JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-jar
          path: configurator/build/libs

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Check for an existing exact backend tag
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          reference="${APP_IMAGE}:${{ needs.verify-release-candidate.outputs.version }}"
          if inspection="$(docker buildx imagetools inspect "${reference}" 2>/dev/null)"; then
            digest="$(awk '/^Digest:/ {print $2; exit}' <<<"${inspection}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker pull --platform linux/amd64 "${reference}"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${reference}")"
            [[ "${revision}" == "${GITHUB_SHA}" ]] || {
              echo "Exact backend tag already belongs to revision ${revision}, refusing to replace it" >&2
              exit 1
            }
            echo "exists=true" >>"${GITHUB_OUTPUT}"
            echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Extract backend image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=${{ needs.verify-release-candidate.outputs.version }}
            type=raw,value=sha-${{ needs.verify-release-candidate.outputs.short-sha }}
            type=raw,value=stable
          labels: |
            org.opencontainers.image.created=${{ needs.verify-release-candidate.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify-release-candidate.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push backend manifest
        if: steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            JAR_FILE=configurator/build/libs/configurator.jar
            OCI_CREATED=${{ needs.verify-release-candidate.outputs.created }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ needs.verify-release-candidate.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-app
          cache-to: type=gha,mode=max,scope=release-app

      - name: Re-promote existing backend manifest
        if: steps.existing.outputs.exists == 'true'
        run: >-
          docker buildx imagetools create
          --tag "${APP_IMAGE}:sha-${{ needs.verify-release-candidate.outputs.short-sha }}"
          --tag "${APP_IMAGE}:stable"
          "${APP_IMAGE}@${{ steps.existing.outputs.digest }}"

      - name: Resolve backend manifest digest
        id: resolve
        shell: bash
        run: |
          if [[ "${{ steps.existing.outputs.exists }}" == true ]]; then
            echo "digest=${{ steps.existing.outputs.digest }}" >>"${GITHUB_OUTPUT}"
          else
            echo "digest=${{ steps.build.outputs.digest }}" >>"${GITHUB_OUTPUT}"
          fi

      - name: Attest backend manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.APP_IMAGE }}
          subject-digest: ${{ steps.resolve.outputs.digest }}
          push-to-registry: true

  publish-gateway-image:
    name: Publish gateway image
    needs: verify-release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Check for an existing exact gateway tag
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          reference="${GATEWAY_IMAGE}:${{ needs.verify-release-candidate.outputs.version }}"
          if inspection="$(docker buildx imagetools inspect "${reference}" 2>/dev/null)"; then
            digest="$(awk '/^Digest:/ {print $2; exit}' <<<"${inspection}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker pull --platform linux/amd64 "${reference}"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${reference}")"
            [[ "${revision}" == "${GITHUB_SHA}" ]] || {
              echo "Exact gateway tag already belongs to revision ${revision}, refusing to replace it" >&2
              exit 1
            }
            echo "exists=true" >>"${GITHUB_OUTPUT}"
            echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Extract gateway image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GATEWAY_IMAGE }}
          tags: |
            type=raw,value=${{ needs.verify-release-candidate.outputs.version }}
            type=raw,value=sha-${{ needs.verify-release-candidate.outputs.short-sha }}
            type=raw,value=stable
          labels: |
            org.opencontainers.image.created=${{ needs.verify-release-candidate.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify-release-candidate.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push gateway manifest
        if: steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: configurator-web
          file: configurator-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            OCI_CREATED=${{ needs.verify-release-candidate.outputs.created }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ needs.verify-release-candidate.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-gateway
          cache-to: type=gha,mode=max,scope=release-gateway

      - name: Re-promote existing gateway manifest
        if: steps.existing.outputs.exists == 'true'
        run: >-
          docker buildx imagetools create
          --tag "${GATEWAY_IMAGE}:sha-${{ needs.verify-release-candidate.outputs.short-sha }}"
          --tag "${GATEWAY_IMAGE}:stable"
          "${GATEWAY_IMAGE}@${{ steps.existing.outputs.digest }}"

      - name: Resolve gateway manifest digest
        id: resolve
        shell: bash
        run: |
          if [[ "${{ steps.existing.outputs.exists }}" == true ]]; then
            echo "digest=${{ steps.existing.outputs.digest }}" >>"${GITHUB_OUTPUT}"
          else
            echo "digest=${{ steps.build.outputs.digest }}" >>"${GITHUB_OUTPUT}"
          fi

      - name: Attest gateway manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.GATEWAY_IMAGE }}
          subject-digest: ${{ steps.resolve.outputs.digest }}
          push-to-registry: true

  verify-public-images:
    name: Verify public multi-platform images
    needs: [verify-release-candidate, publish-app-image, publish-gateway-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Verify anonymous pull, platforms, labels and OCI attestations
        shell: bash
        env:
          APP_DIGEST: ${{ needs.publish-app-image.outputs.digest }}
          GATEWAY_DIGEST: ${{ needs.publish-gateway-image.outputs.digest }}
          VERSION: ${{ needs.verify-release-candidate.outputs.version }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
          for image_and_digest in "${APP_IMAGE}@${APP_DIGEST}" "${GATEWAY_IMAGE}@${GATEWAY_DIGEST}"; do
            inspection="$(docker buildx imagetools inspect "${image_and_digest}")" || {
              echo "Image is not anonymously accessible: ${image_and_digest}" >&2
              exit 1
            }
            grep -Fq 'Platform:    linux/amd64' <<<"${inspection}"
            grep -Eq 'Platform:[[:space:]]+linux/arm64' <<<"${inspection}"
            [[ "$(grep -Ec 'Platform:[[:space:]]+unknown/unknown' <<<"${inspection}")" -ge 2 ]] || {
              echo "Expected SBOM/provenance attestation manifests are missing: ${image_and_digest}" >&2
              exit 1
            }
            docker pull --platform linux/amd64 "${image_and_digest}"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image_and_digest}")"
            version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image_and_digest}")"
            license="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "${image_and_digest}")"
            [[ "${revision}" == "${GITHUB_SHA}" && "${version}" == "${VERSION}" && "${license}" == MIT ]]
          done

      - name: Verify GitHub image attestations
        env:
          GH_TOKEN: ${{ github.token }}
          APP_DIGEST: ${{ needs.publish-app-image.outputs.digest }}
          GATEWAY_DIGEST: ${{ needs.publish-gateway-image.outputs.digest }}
        run: |
          gh attestation verify "oci://${APP_IMAGE}@${APP_DIGEST}" --repo "${GITHUB_REPOSITORY}"
          gh attestation verify "oci://${GATEWAY_IMAGE}@${GATEWAY_DIGEST}" --repo "${GITHUB_REPOSITORY}"

  prepare-release-assets:
    name: Prepare and attest release assets
    needs: [verify-release-candidate, publish-app-image, publish-gateway-image, verify-public-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified release JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-jar
          path: configurator/build/libs

      - name: Assemble release assets
        run: >-
          scripts/release/prepare-release-assets.sh
          "${{ needs.verify-release-candidate.outputs.version }}"
          "configurator/build/libs/configurator.jar"
          "${APP_IMAGE}"
          "${{ needs.publish-app-image.outputs.digest }}"
          "${GATEWAY_IMAGE}"
          "${{ needs.publish-gateway-image.outputs.digest }}"
          release-assets

      - name: Attest downloadable release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Verify checksums and downloadable asset attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-assets && sha256sum --check SHA256SUMS)
          for asset in release-assets/*; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}"
          done

      - name: Upload final release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 3

  draft-release:
    name: Create or update draft release
    needs: [verify-release-candidate, prepare-release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download final release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: final-release-assets
          path: release-assets

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${tag}" --json isDraft --jq .isDraft)"
            [[ "${is_draft}" == true ]] || {
              echo "Release ${tag} is already published; refusing to replace its assets" >&2
              exit 1
            }
            gh release upload "${tag}" release-assets/* --clobber
          else
            notes_file="docs/release/RELEASE_NOTES_${tag}.md"
            [[ -f "${notes_file}" ]] || {
              echo "Release notes are missing: ${notes_file}" >&2
              exit 1
            }
            gh release create "${tag}" release-assets/* \
              --verify-tag \
              --draft \
              --generate-notes \
              --notes-file "${notes_file}" \
              --title "Configurator ${tag}"
          fi
