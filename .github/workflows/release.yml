name: Prepare GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Verify and create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Validate tag and release commit
        id: release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: ${TAG}" >&2
            exit 1
          fi
          git fetch origin master
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Build and verify release candidate
        run: >-
          ./gradlew --no-daemon clean build
          -PreleaseVersion=${{ steps.release.outputs.version }}
          -PspotlessRatchetFrom=origin/develop

      - name: Start external environment
        env:
          JAR_FILE: configurator/build/libs/configurator-${{ steps.release.outputs.version }}.jar
        run: docker compose up -d --build

      - name: Wait for API
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/v3/api-docs >/dev/null

      - name: Run external integration contracts
        run: ./gradlew --no-daemon :configurator-integration-tests:externalIntegrationTest -PreleaseVersion=${{ steps.release.outputs.version }}

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop external environment
        if: always()
        run: docker compose down --volumes

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp "configurator/build/libs/configurator-${{ steps.release.outputs.version }}.jar" release-assets/
          cp specs/configurator-api.yaml release-assets/
          cd release-assets
          sha256sum configurator-* configurator-api.yaml > SHA256SUMS

      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --verify-tag
          --draft
          --prerelease
          --generate-notes
          --title "Configurator ${GITHUB_REF_NAME}"
