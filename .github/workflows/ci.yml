name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend static and unit quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: configurator-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: configurator-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run check

      - name: Enforce frontend coverage
        run: npm run test:coverage

      - name: Upload frontend reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-quality-reports
          path: |
            configurator-web/coverage/
            configurator-web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  frontend-browser:
    name: Frontend browser quality
    needs: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: configurator-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Run functional E2E matrix
        run: npm run test:e2e

      - name: Run accessibility gate
        run: npm run test:accessibility

      - name: Run visual regression gate
        run: npm run test:visual:container

      - name: Upload browser reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-browser-reports
          path: |
            configurator-web/playwright-report/
            configurator-web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build and local contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Build and verify
        run: ./gradlew --no-daemon clean build -PspotlessRatchetFrom=origin/develop

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  external-contracts:
    name: External integration contracts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Build runtime JAR
        run: ./gradlew --no-daemon :configurator:bootJar

      - name: Start external environment
        run: docker compose up -d --build

      - name: Wait for API
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/v3/api-docs >/dev/null

      - name: Run external integration contracts
        run: ./gradlew --no-daemon :configurator-integration-tests:externalIntegrationTest

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop external environment
        if: always()
        run: docker compose down --volumes
