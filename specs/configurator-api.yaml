openapi: 3.1.0
info:
  title: Configurator Backend API
  version: 1.0.0
  description: API спецификация для MVP приложения Configurator

servers:
  - url: http://localhost:8080/api/v1

security:
  - BearerAuth: [ ]

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
      required:
        - timestamp
        - status
        - error
        - message
        - path

    ### Pagination ###
    DomainPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
      required: [ items, page, size, totalItems ]

    ComponentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
      required: [ items, page, size, totalItems ]

    ConfigurationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Configuration'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
      required: [ items, page, size, totalItems ]

    ### AUTH ###
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
      required:
        - id
        - email

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        displayName:
          type: string
          nullable: true
      required:
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
        - token
        - user

    ### DOMAIN ###
    Domain:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt

    CreateDomainRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
      required:
        - name

    UpdateDomainRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
      required:
        - name

    ### COMPONENT TYPE ###
    ComponentType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        domainId:
          type: integer
          format: int64
        name:
          type: string
        code:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        orderIndex:
          type: integer
          nullable: true
      required:
        - id
        - domainId
        - name

    CreateComponentTypeRequest:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        orderIndex:
          type: integer
          nullable: true
      required:
        - name

    ### ATTRIBUTE DEFINITION ###
    AttributeDefinition:
      type: object
      properties:
        id:
          type: integer
          format: int64
        componentTypeId:
          type: integer
          format: int64
        name:
          type: string
        label:
          type: string
        dataType:
          type: string
          enum: [ STRING, NUMBER, BOOLEAN, ENUM ]
        enumValues:
          type: array
          items:
            type: string
          nullable: true
        isRequired:
          type: boolean
        orderIndex:
          type: integer
          nullable: true
      required:
        - id
        - componentTypeId
        - name
        - label
        - dataType
        - isRequired

    CreateAttributeDefinitionRequest:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        dataType:
          type: string
          enum: [ STRING, NUMBER, BOOLEAN, ENUM ]
        enumValues:
          type: array
          items:
            type: string
          nullable: true
        isRequired:
          type: boolean
          default: false
        orderIndex:
          type: integer
          nullable: true
      required:
        - name
        - label
        - dataType

    ### ATTRIBUTE VALUE ###
    AttributeValueInput:
      type: object
      properties:
        attributeDefinitionId:
          type: integer
          format: int64
        value:
          type: string
      required:
        - attributeDefinitionId
        - value

    AttributeValue:
      type: object
      properties:
        attributeDefinitionId:
          type: integer
          format: int64
        name:
          type: string
        label:
          type: string
        dataType:
          type: string
          enum: [ STRING, NUMBER, BOOLEAN, ENUM ]
        value:
          type: string
          nullable: true
      required:
        - attributeDefinitionId
        - name
        - label
        - dataType

    ### COMPONENT IMAGE ###
    ComponentImage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
        orderIndex:
          type: integer
          nullable: true
      required:
        - id
        - url

    ### COMPONENT ###
    Component:
      type: object
      properties:
        id:
          type: integer
          format: int64
        componentTypeId:
          type: integer
          format: int64
        name:
          type: string
        brand:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValue'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ComponentImage'
      required:
        - id
        - componentTypeId
        - name
        - archived
        - createdAt

    CreateComponentRequest:
      type: object
      properties:
        componentTypeId:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          pattern: '^\S.*'
        brand:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValueInput'
          nullable: true
      required:
        - componentTypeId
        - name

    UpdateComponentRequest:
      type: object
      properties:
        componentTypeId:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          pattern: '^\S.*'
        brand:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValueInput'
      required:
        - componentTypeId
        - name
        - attributes

    ### COMPATIBILITY ###
    CompatibilityLink:
      type: object
      properties:
        id:
          type: integer
          format: int64
        domainId:
          type: integer
          format: int64
        componentAId:
          type: integer
          format: int64
        componentBId:
          type: integer
          format: int64
        comment:
          type: string
          nullable: true
      required:
        - id
        - domainId
        - componentAId
        - componentBId

    CreateCompatibilityLinkRequest:
      type: object
      properties:
        componentAId:
          type: integer
          format: int64
          minimum: 1
        componentBId:
          type: integer
          format: int64
          minimum: 1
        comment:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional comment; blank values are normalized to null
      required:
        - componentAId
        - componentBId

    CompatibilityRuleOperator:
      type: string
      description: Comparison applied to the left and right attribute values
      enum:
        - EQUALS
        - NOT_EQUALS
        - GT
        - GTE
        - LT
        - LTE

    CompatibilityRuleConditionInput:
      type: object
      properties:
        leftAttributeDefinitionId:
          type: integer
          format: int64
          minimum: 1
        operator:
          $ref: '#/components/schemas/CompatibilityRuleOperator'
        rightAttributeDefinitionId:
          type: integer
          format: int64
          minimum: 1
        orderIndex:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Defaults to the condition position in the request
      required:
        - leftAttributeDefinitionId
        - operator
        - rightAttributeDefinitionId

    SaveCompatibilityRuleSetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          description: Human-readable name; surrounding whitespace is removed
        componentTypeAId:
          type: integer
          format: int64
          minimum: 1
        componentTypeBId:
          type: integer
          format: int64
          minimum: 1
        enabled:
          type: boolean
        conditions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CompatibilityRuleConditionInput'
      required:
        - name
        - componentTypeAId
        - componentTypeBId
        - enabled
        - conditions

    CompatibilityRuleCondition:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ruleSetId:
          type: integer
          format: int64
        leftAttributeDefinitionId:
          type: integer
          format: int64
        operator:
          $ref: '#/components/schemas/CompatibilityRuleOperator'
        rightAttributeDefinitionId:
          type: integer
          format: int64
        orderIndex:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - ruleSetId
        - leftAttributeDefinitionId
        - operator
        - rightAttributeDefinitionId
        - orderIndex
        - createdAt

    CompatibilityRuleSet:
      type: object
      properties:
        id:
          type: integer
          format: int64
        domainId:
          type: integer
          format: int64
        name:
          type: string
        componentTypeAId:
          type: integer
          format: int64
        componentTypeBId:
          type: integer
          format: int64
        enabled:
          type: boolean
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilityRuleCondition'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - domainId
        - name
        - componentTypeAId
        - componentTypeBId
        - enabled
        - conditions
        - createdAt

    ### GRAPH ###
    GraphNode:
      type: object
      description: Active component represented as a graph node
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        componentTypeId:
          type: integer
          format: int64
        componentTypeName:
          type: string
        brand:
          type: string
          nullable: true
      required:
        - id
        - name
        - componentTypeId
        - componentTypeName

    GraphEdge:
      type: object
      description: Compatibility link between two active components of the domain
      properties:
        id:
          type: integer
          format: int64
        source:
          type: integer
          format: int64
        target:
          type: integer
          format: int64
        comment:
          type: string
          nullable: true
          description: Compatibility link comment
      required:
        - id
        - source
        - target

    GraphResponse:
      type: object
      description: Compatibility graph containing all active domain components, including isolated nodes
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
      required:
        - nodes
        - edges

    ### CONFIGURATOR ###
    ComponentShort:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        brand:
          type: string
          nullable: true
        componentTypeId:
          type: integer
          format: int64
      required:
        - id
        - name
        - componentTypeId

    ConfiguratorTypeGroup:
      type: object
      properties:
        componentTypeId:
          type: integer
          format: int64
        componentTypeName:
          type: string
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentShort'
      required:
        - componentTypeId
        - componentTypeName
        - components

    ConfiguratorResponse:
      type: object
      properties:
        baseComponentId:
          type: integer
          format: int64
        compatibleByType:
          type: array
          items:
            $ref: '#/components/schemas/ConfiguratorTypeGroup'
      required:
        - baseComponentId
        - compatibleByType

    ### CONFIGURATION ###
    Configuration:
      type: object
      properties:
        id:
          type: integer
          format: int64
        domainId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentShort'
      required:
        - id
        - domainId
        - name

    CreateConfigurationRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        componentIds:
          type: array
          items:
            type: integer
            format: int64
      required:
        - name
        - componentIds

paths:

  ###################################
  # AUTH
  ###################################

  /auth/register:
    post:
      tags: [ Auth ]
      summary: Register user
      security: [ ]   # публичный эндпоинт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Successful registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [ Auth ]
      summary: Login user
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # DOMAINS
  ###################################

  /domains:
    get:
      tags: [ Domains ]
      summary: List domains (paged)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainPage'

    post:
      tags: [ Domains ]
      summary: Create domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Domain name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /domains/{id}:
    get:
      tags: [ Domains ]
      summary: Get domain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Domain found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [ Domains ]
      summary: Update domain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDomainRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [ Domains ]
      summary: Delete domain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Domain has dependent entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # COMPONENT TYPES
  ###################################

  /domains/{id}/component-types:
    get:
      tags: [ Component Types ]
      summary: List component types of a domain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComponentType'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [ Component Types ]
      summary: Create component type in domain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComponentTypeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentType'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ComponentType name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /component-types/{id}:
    get:
      tags: [ Component Types ]
      summary: Get component type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentType'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [ Component Types ]
      summary: Update component type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComponentTypeRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentType'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [ Component Types ]
      summary: Delete component type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # ATTRIBUTE DEFINITIONS
  ###################################

  /component-types/{id}/attributes:
    get:
      tags: [ Attributes ]
      summary: List attribute definitions of a component type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttributeDefinition'
        '404':
          description: ComponentType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [ Attributes ]
      summary: Create attribute definition for a component type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttributeDefinitionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinition'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ComponentType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Attribute name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /attributes/{id}:
    put:
      tags: [ Attributes ]
      summary: Update attribute definition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttributeDefinitionRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinition'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # COMPONENTS
  ###################################

  /domains/{domainId}/components:
    get:
      tags: [ Components ]
      summary: List components of domain (paged)
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: componentTypeId
          in: query
          schema:
            type: integer
            format: int64
        - name: name
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentPage'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /components:
    post:
      tags: [ Components ]
      summary: Create component
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComponentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ComponentType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ComponentType with name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /components/{id}:
    get:
      tags: [ Components ]
      summary: Get component details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [ Components ]
      summary: Update component
      description: Fully replaces editable component fields and attribute values. Component type cannot be changed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComponentRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Component with the same name already exists within the component type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [ Components ]
      summary: Archive component
      description: Archives a component without deleting its attributes, images, compatibility links, or configuration references.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Archived
        '400':
          description: Invalid component identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # COMPONENT IMAGES
  ###################################

  /components/{id}/images:
    post:
      tags: [ Components ]
      summary: Upload image for component
      description: |
        Uploads a JPEG, PNG, or WebP image up to 10 MiB to external object storage
        and attaches it to an active component. If orderIndex is omitted, the image
        is placed after all existing component images.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  maxLength: 10485760
                  description: JPEG, PNG, or WebP image with a maximum size of 10 MiB
                orderIndex:
                  type: integer
                  minimum: 0
                  nullable: true
                  description: Optional non-negative display order; defaults to the next available index
              required:
                - file
      responses:
        '201':
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentImage'
        '400':
          description: Invalid file or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Component is archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Image exceeds the 10 MiB size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported image format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: External object storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [ Components ]
      summary: Get images of component
      description: |
        Returns all images of an existing component, including an archived component.
        An empty array is returned when the component has no images. Images are ordered
        by orderIndex ascending with null values last, then by id ascending.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComponentImage'
        '400':
          description: Invalid component identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # COMPATIBILITY
  ###################################

  /domains/{id}/compatibility:
    post:
      tags: [ Compatibility ]
      summary: Create compatibility link
      description: |
        Creates one undirected COMPATIBLE link between two active components of the
        specified domain. The component identifiers are normalized before persistence:
        the smaller identifier is stored as componentAId and the larger as componentBId.
        Blank comments are normalized to null.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompatibilityLinkRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityLink'
        '400':
          description: Invalid input, self-link, or component outside the specified domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate compatibility link or archived component
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /domains/{id}/compatibility/rules:
    get:
      tags: [ Compatibility ]
      summary: Get compatibility rule sets
      description: Returns all automatic compatibility rule sets of the domain in identifier order.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Compatibility rule sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompatibilityRuleSet'
        '400':
          description: Invalid domain identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [ Compatibility ]
      summary: Create compatibility rule set
      description: |
        Creates an attribute-to-attribute automatic compatibility rule set. The component-type
        pair is stored in ascending identifier order. When the submitted pair is reversed,
        condition sides and directional operators are reversed as well.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCompatibilityRuleSetRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityRuleSet'
        '400':
          description: Invalid rule set, condition, component type, or attribute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or component type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Rule set with the same name and component-type pair already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /domains/{id}/compatibility/rules/{ruleId}:
    get:
      tags: [ Compatibility ]
      summary: Get compatibility rule set
      description: Returns a rule set scoped to the specified domain.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Compatibility rule set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityRuleSet'
        '400':
          description: Invalid domain or rule-set identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or compatibility rule set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [ Compatibility ]
      summary: Replace compatibility rule set
      description: |
        Fully replaces rule-set metadata and conditions while preserving its identifier and
        creation timestamp. The rule set remains scoped to the specified domain.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCompatibilityRuleSetRequest'
      responses:
        '200':
          description: Updated compatibility rule set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityRuleSet'
        '400':
          description: Invalid rule set, condition, component type, or attribute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain, component type, or compatibility rule set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Rule set with the same name and component-type pair already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [ Compatibility ]
      summary: Delete compatibility rule set
      description: Physically deletes a rule set and all its conditions within the specified domain.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid domain or rule-set identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or compatibility rule set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /domains/{id}/compatibility/{linkId}:
    delete:
      tags: [ Compatibility ]
      summary: Delete compatibility link
      description: |
        Physically deletes a compatibility link scoped to the specified domain.
        A link that belongs to another domain is treated as not found.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: linkId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid domain or compatibility link identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or compatibility link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # GRAPH
  ###################################

  /domains/{id}/compatibility/graph:
    get:
      tags: [ Compatibility ]
      summary: Get compatibility graph of domain
      description: >
        Returns all non-archived components of the domain as nodes, including isolated components,
        and compatibility links whose endpoints are both present in the graph.
        Nodes and edges are sorted by identifier in ascending order.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Compatibility graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphResponse'
        '400':
          description: Invalid domain identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # CONFIGURATOR
  ###################################

  /domains/{id}/configurator/compatible:
    get:
      tags: [ Configurator ]
      summary: Get compatible components for selected component
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: componentId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguratorResponse'
        '400':
          description: Missing componentId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # CONFIGURATIONS (SAVED BUILDS)
  ###################################

  /domains/{id}/configurations:
    get:
      tags: [ Configurations ]
      summary: List configurations of domain (paged)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationPage'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [ Configurations ]
      summary: Create configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConfigurationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid input or components from different domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /configurations/{id}:
    get:
      tags: [ Configurations ]
      summary: Get configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /configurations/{id}/export/json:
    get:
      tags: [ Configurations ]
      summary: Export configuration as JSON
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Exported JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
