openapi: 3.1.0
info:
  title: Configurator Backend API
  version: 1.0.0
  description: API спецификация для MVP приложения Configurator

servers:
  - url: http://localhost:8080

security:
  - BearerAuth: [ ]

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
        path:
          type: string
        details:
          type: array
          description: Structured error details; empty when the error has no additional details
          items:
            $ref: '#/components/schemas/ApiErrorDetail'
      required:
        - timestamp
        - status
        - error
        - code
        - message
        - path
        - details

    ApiErrorCode:
      type: string
      description: Stable machine-readable error category
      enum:
        - BUSINESS_ERROR
        - INTERNAL_ERROR
        - NOT_FOUND
        - ENTITY_ALREADY_EXISTS
        - ENTITY_HAS_RELATED_ENTITIES
        - COMPONENT_ARCHIVED
        - CONFIGURATION_CONFLICT
        - VALIDATION_ERROR
        - IMAGE_TOO_LARGE
        - UNSUPPORTED_IMAGE_FORMAT
        - EXTERNAL_STORAGE_UNAVAILABLE

    ApiErrorDetail:
      type: object
      properties:
        field:
          type: string
          nullable: true
          description: Request field or parameter path; absent for object-level errors
        code:
          type: string
          description: Stable detail or validation constraint code in UPPER_SNAKE_CASE
        message:
          type: string
          description: Human-readable detail without rejected values or internal diagnostics
      required:
        - code
        - message

    ### Pagination ###
    DomainPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
      required: [ items, page, size, totalItems ]

    ComponentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
      required: [ items, page, size, totalItems ]

    ConfigurationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Configuration'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
      required: [ items, page, size, totalItems ]

    ### AUTH ###
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
      required:
        - id
        - email

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        displayName:
          type: string
          nullable: true
      required:
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
        - token
        - user

    ### DOMAIN ###
    Domain:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt

    CreateDomainRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
      required:
        - name

    UpdateDomainRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
      required:
        - name

    ### COMPONENT TYPE ###
    ComponentType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        domainId:
          type: integer
          format: int64
        name:
          type: string
        code:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        orderIndex:
          type: integer
          nullable: true
      required:
        - id
        - domainId
        - name

    CreateComponentTypeRequest:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        orderIndex:
          type: integer
          nullable: true
      required:
        - name

    ### ATTRIBUTE DEFINITION ###
    AttributeDefinition:
      type: object
      properties:
        id:
          type: integer
          format: int64
        componentTypeId:
          type: integer
          format: int64
        name:
          type: string
        label:
          type: string
        dataType:
          type: string
          enum: [ STRING, NUMBER, BOOLEAN, ENUM ]
        enumValues:
          type: array
          items:
            type: string
          nullable: true
        isRequired:
          type: boolean
        orderIndex:
          type: integer
          nullable: true
      required:
        - id
        - componentTypeId
        - name
        - label
        - dataType
        - isRequired

    CreateAttributeDefinitionRequest:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        dataType:
          type: string
          enum: [ STRING, NUMBER, BOOLEAN, ENUM ]
        enumValues:
          type: array
          items:
            type: string
          nullable: true
        isRequired:
          type: boolean
          default: false
        orderIndex:
          type: integer
          nullable: true
      required:
        - name
        - label
        - dataType

    ### ATTRIBUTE VALUE ###
    AttributeValueInput:
      type: object
      properties:
        attributeDefinitionId:
          type: integer
          format: int64
        value:
          type: string
      required:
        - attributeDefinitionId
        - value

    AttributeValue:
      type: object
      properties:
        attributeDefinitionId:
          type: integer
          format: int64
        name:
          type: string
        label:
          type: string
        dataType:
          type: string
          enum: [ STRING, NUMBER, BOOLEAN, ENUM ]
        value:
          type: string
          nullable: true
      required:
        - attributeDefinitionId
        - name
        - label
        - dataType

    ### COMPONENT IMAGE ###
    ComponentImage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          description: Relative backend URL for retrieving the image content
          example: /component-images/42/content
        orderIndex:
          type: integer
          nullable: true
      required:
        - id
        - url

    ReorderComponentImagesRequest:
      type: object
      description: Full ordered set of image identifiers currently attached to the component
      properties:
        imageIds:
          type: array
          description: Image identifiers in the desired display order; an empty array is valid for an empty gallery
          items:
            type: integer
            format: int64
            minimum: 1
      required:
        - imageIds

    ### COMPONENT ###
    Component:
      type: object
      properties:
        id:
          type: integer
          format: int64
        componentTypeId:
          type: integer
          format: int64
        name:
          type: string
        brand:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValue'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ComponentImage'
      required:
        - id
        - componentTypeId
        - name
        - archived
        - createdAt

    CreateComponentRequest:
      type: object
      properties:
        componentTypeId:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          pattern: '^\S.*'
        brand:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValueInput'
          nullable: true
      required:
        - componentTypeId
        - name

    UpdateComponentRequest:
      type: object
      properties:
        componentTypeId:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          pattern: '^\S.*'
        brand:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValueInput'
      required:
        - componentTypeId
        - name
        - attributes

    ### COMPATIBILITY ###
    CompatibilityLink:
      type: object
      properties:
        id:
          type: integer
          format: int64
        domainId:
          type: integer
          format: int64
        componentAId:
          type: integer
          format: int64
        componentBId:
          type: integer
          format: int64
        comment:
          type: string
          nullable: true
      required:
        - id
        - domainId
        - componentAId
        - componentBId

    CreateCompatibilityLinkRequest:
      type: object
      properties:
        componentAId:
          type: integer
          format: int64
          minimum: 1
        componentBId:
          type: integer
          format: int64
          minimum: 1
        comment:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional comment; blank values are normalized to null
      required:
        - componentAId
        - componentBId

    CompatibilityRuleOperator:
      type: string
      description: Comparison applied to the left and right attribute values
      enum:
        - EQUALS
        - NOT_EQUALS
        - GT
        - GTE
        - LT
        - LTE

    CompatibilityRuleConditionInput:
      type: object
      properties:
        leftAttributeDefinitionId:
          type: integer
          format: int64
          minimum: 1
        operator:
          $ref: '#/components/schemas/CompatibilityRuleOperator'
        rightAttributeDefinitionId:
          type: integer
          format: int64
          minimum: 1
        orderIndex:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Defaults to the condition position in the request
      required:
        - leftAttributeDefinitionId
        - operator
        - rightAttributeDefinitionId

    SaveCompatibilityRuleSetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          description: Human-readable name; surrounding whitespace is removed
        componentTypeAId:
          type: integer
          format: int64
          minimum: 1
        componentTypeBId:
          type: integer
          format: int64
          minimum: 1
        enabled:
          type: boolean
        conditions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CompatibilityRuleConditionInput'
      required:
        - name
        - componentTypeAId
        - componentTypeBId
        - enabled
        - conditions

    CompatibilityRuleCondition:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ruleSetId:
          type: integer
          format: int64
        leftAttributeDefinitionId:
          type: integer
          format: int64
        operator:
          $ref: '#/components/schemas/CompatibilityRuleOperator'
        rightAttributeDefinitionId:
          type: integer
          format: int64
        orderIndex:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - ruleSetId
        - leftAttributeDefinitionId
        - operator
        - rightAttributeDefinitionId
        - orderIndex
        - createdAt

    CompatibilityRuleSet:
      type: object
      properties:
        id:
          type: integer
          format: int64
        domainId:
          type: integer
          format: int64
        name:
          type: string
        componentTypeAId:
          type: integer
          format: int64
        componentTypeBId:
          type: integer
          format: int64
        enabled:
          type: boolean
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilityRuleCondition'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - domainId
        - name
        - componentTypeAId
        - componentTypeBId
        - enabled
        - conditions
        - createdAt

    ### GRAPH ###
    GraphNode:
      type: object
      description: Active component represented as a graph node
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        componentTypeId:
          type: integer
          format: int64
        componentTypeName:
          type: string
        brand:
          type: string
          nullable: true
      required:
        - id
        - name
        - componentTypeId
        - componentTypeName

    GraphEdge:
      type: object
      description: Compatibility link between two active components of the domain
      properties:
        id:
          type: integer
          format: int64
        source:
          type: integer
          format: int64
        target:
          type: integer
          format: int64
        comment:
          type: string
          nullable: true
          description: Compatibility link comment
      required:
        - id
        - source
        - target

    GraphResponse:
      type: object
      description: Compatibility graph containing all active domain components, including isolated nodes
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
      required:
        - nodes
        - edges

    ### CONFIGURATOR ###
    ComponentShort:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        brand:
          type: string
          nullable: true
        componentTypeId:
          type: integer
          format: int64
      required:
        - id
        - name
        - componentTypeId

    CompatibilityExplanationSource:
      type: string
      description: Source that made the candidate component compatible
      enum:
        - MANUAL
        - AUTOMATIC
        - TRANSITIVE

    CompatibilityConditionExplanation:
      type: object
      description: Successful attribute comparison from an automatic compatibility rule
      properties:
        leftAttributeDefinitionId:
          type: integer
          format: int64
        leftAttributeName:
          type: string
        leftValue:
          type: string
        operator:
          $ref: '#/components/schemas/CompatibilityRuleOperator'
        rightAttributeDefinitionId:
          type: integer
          format: int64
        rightAttributeName:
          type: string
        rightValue:
          type: string
      required:
        - leftAttributeDefinitionId
        - leftAttributeName
        - leftValue
        - operator
        - rightAttributeDefinitionId
        - rightAttributeName
        - rightValue

    CompatibilityExplanation:
      type: object
      description: |
        One reason why the candidate is compatible. Manual explanations contain linkId and
        optional comment. Automatic explanations contain ruleSetId, ruleSetName and all
        successful rule conditions. Transitive explanations contain a shortest component path.
      properties:
        source:
          $ref: '#/components/schemas/CompatibilityExplanationSource'
        linkId:
          type: integer
          format: int64
          nullable: true
        comment:
          type: string
          nullable: true
        ruleSetId:
          type: integer
          format: int64
          nullable: true
        ruleSetName:
          type: string
          nullable: true
        conditions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/CompatibilityConditionExplanation'
        pathComponentIds:
          type: array
          nullable: true
          minItems: 3
          description: |
            Ordered shortest path from the base component to a transitively compatible
            component. Present only for TRANSITIVE explanations.
          items:
            type: integer
            format: int64
            minimum: 1
      required:
        - source

    ConfiguratorCompatibleComponent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        brand:
          type: string
          nullable: true
        componentTypeId:
          type: integer
          format: int64
        explanations:
          type: array
          description: All manual links and enabled automatic rule sets that matched
          items:
            $ref: '#/components/schemas/CompatibilityExplanation'
      required:
        - id
        - name
        - componentTypeId
        - explanations

    ConfiguratorTypeGroup:
      type: object
      properties:
        componentTypeId:
          type: integer
          format: int64
        componentTypeName:
          type: string
        components:
          type: array
          items:
            $ref: '#/components/schemas/ConfiguratorCompatibleComponent'
      required:
        - componentTypeId
        - componentTypeName
        - components

    ConfiguratorResponse:
      type: object
      properties:
        baseComponentId:
          type: integer
          format: int64
        compatibleByType:
          type: array
          items:
            $ref: '#/components/schemas/ConfiguratorTypeGroup'
      required:
        - baseComponentId
        - compatibleByType

    ConfiguratorBatchSearchRequest:
      type: object
      properties:
        componentIds:
          type: array
          minItems: 1
          maxItems: 50
          description: Unique base component identifiers in requested result order
          items:
            type: integer
            format: int64
            minimum: 1
        includeTransitive:
          type: boolean
          default: false
          description: Include components reachable through two or more compatibility edges
      required:
        - componentIds

    ConfiguratorBatchSearchResponse:
      type: object
      properties:
        results:
          type: array
          description: Independent compatibility results in componentIds request order
          items:
            $ref: '#/components/schemas/ConfiguratorResponse'
      required:
        - results

    ConfiguratorIntersectionRequest:
      type: object
      properties:
        componentIds:
          type: array
          minItems: 2
          maxItems: 50
          description: Unique base component identifiers whose compatibility sets are intersected
          items:
            type: integer
            format: int64
            minimum: 1
        includeTransitive:
          type: boolean
          default: false
          description: Include components reachable through two or more compatibility edges
      required:
        - componentIds

    ConfiguratorBaseCompatibility:
      type: object
      properties:
        baseComponentId:
          type: integer
          format: int64
        explanations:
          type: array
          description: Reasons why the candidate is compatible with this base component
          items:
            $ref: '#/components/schemas/CompatibilityExplanation'
      required:
        - baseComponentId
        - explanations

    ConfiguratorIntersectionCompatibleComponent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        brand:
          type: string
          nullable: true
        componentTypeId:
          type: integer
          format: int64
        compatibilityByBase:
          type: array
          description: Compatibility evidence for every selected base component in request order
          items:
            $ref: '#/components/schemas/ConfiguratorBaseCompatibility'
      required:
        - id
        - name
        - componentTypeId
        - compatibilityByBase

    ConfiguratorIntersectionTypeGroup:
      type: object
      properties:
        componentTypeId:
          type: integer
          format: int64
        componentTypeName:
          type: string
        components:
          type: array
          items:
            $ref: '#/components/schemas/ConfiguratorIntersectionCompatibleComponent'
      required:
        - componentTypeId
        - componentTypeName
        - components

    ConfiguratorIntersectionResponse:
      type: object
      properties:
        componentIds:
          type: array
          description: Selected base component identifiers in request order
          items:
            type: integer
            format: int64
        compatibleByType:
          type: array
          description: Components compatible with every selected base component
          items:
            $ref: '#/components/schemas/ConfiguratorIntersectionTypeGroup'
      required:
        - componentIds
        - compatibleByType

    ### CONFIGURATION ###
    ConfigurationComponent:
      type: object
      description: Current component data included in a saved configuration
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        brand:
          type: string
          nullable: true
        componentTypeId:
          type: integer
          format: int64
        componentTypeName:
          type: string
        archived:
          type: boolean
          description: Whether the component was archived after the configuration was saved
      required:
        - id
        - name
        - componentTypeId
        - componentTypeName
        - archived

    Configuration:
      type: object
      description: |
        Saved user configuration. Components contain their current catalog state and are ordered
        by component type orderIndex, component type name and component id.
      properties:
        id:
          type: integer
          format: int64
        domainId:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        createdAt:
          type: string
          format: date-time
        components:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationComponent'
      required:
        - id
        - domainId
        - name
        - createdAt
        - components

    CreateConfigurationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name is trimmed by the backend and must remain non-blank
        description:
          type: string
          nullable: true
          maxLength: 4000
          description: Blank description is normalized to null
        componentIds:
          type: array
          minItems: 1
          maxItems: 50
          description: |
            Unique active components from the path domain. At most one component of each type is
            allowed. Every pair must be directly compatible through a manual link or an enabled
            automatic attribute rule. Transitive reachability does not validate a configuration.
          items:
            type: integer
            format: int64
            minimum: 1
      required:
        - name
        - componentIds

    UpdateConfigurationRequest:
      type: object
      description: |
        Complete replacement of the mutable configuration data. Domain, owner and creation time
        are preserved by the backend and cannot be changed by this request.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name is trimmed by the backend and must remain non-blank
        description:
          type: string
          nullable: true
          maxLength: 4000
          description: Blank description is normalized to null
        componentIds:
          type: array
          minItems: 1
          maxItems: 50
          description: |
            Complete replacement set of unique active components from the configuration domain.
            At most one component of each type is allowed. Every pair must be directly compatible
            through a manual link or an enabled automatic attribute rule. An archived component is
            rejected even when it already belongs to the saved configuration.
          items:
            type: integer
            format: int64
            minimum: 1
      required:
        - name
        - componentIds

    ConfigurationExport:
      type: object
      description: Versioned, self-contained JSON export of a saved configuration
      properties:
        schemaVersion:
          type: integer
          minimum: 1
          example: 1
        exportedAt:
          type: string
          format: date-time
        configuration:
          $ref: '#/components/schemas/Configuration'
      required:
        - schemaVersion
        - exportedAt
        - configuration

paths:

  ###################################
  # AUTH
  ###################################

  /auth/register:
    post:
      tags: [ Auth ]
      summary: Register user
      security: [ ]   # публичный эндпоинт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Successful registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [ Auth ]
      summary: Login user
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # DOMAINS
  ###################################

  /domains:
    get:
      tags: [ Domains ]
      summary: List domains (paged)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
