  ###################################
  # COMPONENTS
  ###################################

  /domains/{domainId}/components:
    get:
      tags: [ Components ]
      summary: List components of domain (paged)
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: componentTypeId
          in: query
          schema:
            type: integer
            format: int64
        - name: name
          in: query
          schema:
            type: string
        - name: archived
          in: query
          description: |
            Optional archive filter. true returns only archived components, false returns only active
            components, and an omitted parameter preserves the existing unfiltered result.
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentPage'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /components:
    post:
      tags: [ Components ]
      summary: Create component
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComponentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ComponentType not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ComponentType with name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /components/{id}:
    get:
      tags: [ Components ]
      summary: Get component details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [ Components ]
      summary: Update component
      description: Fully replaces editable component fields and attribute values. Component type cannot be changed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComponentRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Component with the same name already exists within the component type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [ Components ]
      summary: Archive component
      description: Archives a component without deleting its attributes, images, compatibility links, or configuration references.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Archived
        '400':
          description: Invalid component identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /components/{id}/restore:
    post:
      tags: [ Components ]
      summary: Restore archived component
      description: |
        Idempotently returns a component to the active catalog. An already active component is
        returned unchanged. Attributes, images, compatibility links, and configuration references
        are preserved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Component is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        '400':
          description: Invalid component identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # COMPONENT IMAGES
  ###################################

  /component-images/{id}:
    delete:
      tags: [ Component Images ]
      summary: Delete component image
      description: |
        Permanently deletes an image attached to an active component. The object is removed from
        external storage before its metadata is deleted. If object storage is unavailable, metadata
        remains unchanged so deletion can be retried. Images of archived components cannot be deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Component image deleted
        '400':
          description: Invalid component image identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Component image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Parent component is archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: External object storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /component-images/{id}/content:
    get:
      tags: [ Component Images ]
      summary: Get component image content
      description: |
        Returns the original JPEG, PNG, or WebP bytes through the backend so object storage can
        remain private. Images attached to archived components remain available. The response is
        never redirected to an object-storage URL.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Original image content
          headers:
            Cache-Control:
              description: Private response that must be revalidated before reuse
              schema:
                type: string
                example: private, no-cache
            Content-Disposition:
              description: Displays the image inline
              schema:
                type: string
                example: inline
            Content-Length:
              description: Image size in bytes
              schema:
                type: integer
                format: int64
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid component image identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Component image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: External object storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /components/{id}/images:
    post:
      tags: [ Components ]
      summary: Upload image for component
      description: |
        Uploads a JPEG, PNG, or WebP image up to 10 MiB to external object storage
        and attaches it to an active component. If orderIndex is omitted, the image
        is placed after all existing component images.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  maxLength: 10485760
                  description: JPEG, PNG, or WebP image with a maximum size of 10 MiB
                orderIndex:
                  type: integer
                  minimum: 0
                  nullable: true
                  description: Optional non-negative display order; defaults to the next available index
              required:
                - file
      responses:
        '201':
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentImage'
        '400':
          description: Invalid file or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Component is archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Image exceeds the 10 MiB size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported image format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: External object storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [ Components ]
      summary: Get images of component
      description: |
        Returns all images of an existing component, including an archived component.
        An empty array is returned when the component has no images. Images are ordered
        by orderIndex ascending with null values last, then by id ascending.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComponentImage'
        '400':
          description: Invalid component identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /components/{id}/images/order:
    put:
      tags: [ Components ]
      summary: Replace component image order
      description: |
        Atomically replaces the display order of all images attached to an active component.
        The request must contain every current image identifier exactly once and no foreign image
        identifiers. The first identifier receives orderIndex 0, the second 1, and so on.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderComponentImagesRequest'
      responses:
        '200':
          description: Image order replaced
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComponentImage'
        '400':
          description: Invalid identifier list or list does not exactly match current component images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Component is archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # COMPATIBILITY
  ###################################

  /domains/{id}/compatibility:
    post:
      tags: [ Compatibility ]
      summary: Create compatibility link
      description: |
        Creates one undirected COMPATIBLE link between two active components of the
        specified domain. The component identifiers are normalized before persistence:
        the smaller identifier is stored as componentAId and the larger as componentBId.
        Blank comments are normalized to null.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompatibilityLinkRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityLink'
        '400':
          description: Invalid input, self-link, or component outside the specified domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate compatibility link or archived component
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /domains/{id}/compatibility/rules:
    get:
      tags: [ Compatibility ]
      summary: Get compatibility rule sets
      description: Returns all automatic compatibility rule sets of the domain in identifier order.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Compatibility rule sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompatibilityRuleSet'
        '400':
          description: Invalid domain identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [ Compatibility ]
      summary: Create compatibility rule set
      description: |
        Creates an attribute-to-attribute automatic compatibility rule set. The component-type
        pair is stored in ascending identifier order. When the submitted pair is reversed,
        condition sides and directional operators are reversed as well.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCompatibilityRuleSetRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityRuleSet'
        '400':
          description: Invalid rule set, condition, component type, or attribute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or component type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Rule set with the same name and component-type pair already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /domains/{id}/compatibility/rules/{ruleId}:
    get:
      tags: [ Compatibility ]
      summary: Get compatibility rule set
      description: Returns a rule set scoped to the specified domain.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Compatibility rule set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityRuleSet'
        '400':
          description: Invalid domain or rule-set identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or compatibility rule set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [ Compatibility ]
      summary: Replace compatibility rule set
      description: |
        Fully replaces rule-set metadata and conditions while preserving its identifier and
        creation timestamp. The rule set remains scoped to the specified domain.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCompatibilityRuleSetRequest'
      responses:
        '200':
          description: Updated compatibility rule set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityRuleSet'
        '400':
          description: Invalid rule set, condition, component type, or attribute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain, component type, or compatibility rule set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Rule set with the same name and component-type pair already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [ Compatibility ]
      summary: Delete compatibility rule set
      description: Physically deletes a rule set and all its conditions within the specified domain.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid domain or rule-set identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or compatibility rule set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /domains/{id}/compatibility/{linkId}:
    delete:
      tags: [ Compatibility ]
      summary: Delete compatibility link
      description: |
        Physically deletes a compatibility link scoped to the specified domain.
        A link that belongs to another domain is treated as not found.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: linkId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid domain or compatibility link identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or compatibility link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # GRAPH
  ###################################

  /domains/{id}/compatibility/graph:
    get:
      tags: [ Compatibility ]
      summary: Get compatibility graph of domain
      description: >
        Returns all non-archived components of the domain as nodes, including isolated components,
        and compatibility links whose endpoints are both present in the graph.
        Nodes and edges are sorted by identifier in ascending order.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Compatibility graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphResponse'
        '400':
          description: Invalid domain identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # CONFIGURATOR
  ###################################

  /domains/{id}/configurator/compatible:
    get:
      tags: [ Configurator ]
      summary: Get compatible components for selected component
      description: |
        Returns active domain components that are directly compatible with the selected active
        component through either a manual compatibility link or at least one enabled automatic
        attribute rule set. All conditions inside one rule set must match; multiple rule sets are
        alternatives. Every returned component contains compatibility explanations. By default,
        only direct compatibility is returned. When includeTransitive=true, active components
        reachable through the manual and automatic compatibility graph are also returned with
        one deterministic shortest path. Results are grouped by component type.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: componentId
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: includeTransitive
          in: query
          required: false
          description: Include components reachable through two or more compatibility edges
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguratorResponse'
        '400':
          description: Invalid identifier, component outside the domain, or archived base component
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /domains/{id}/configurator/compatible/search:
    post:
      tags: [ Configurator ]
      summary: Search compatibility independently for multiple selected components
      description: |
        Calculates the same direct or transitive compatibility result as the single-component
        endpoint for every requested active base component. Results preserve componentIds order.
        Sets are not combined or intersected. Domain components, manual links, enabled automatic
        rules and the compatibility graph are loaded once for the whole request.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguratorBatchSearchRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguratorBatchSearchResponse'
        '400':
          description: Invalid, duplicate, archived, or out-of-domain base component
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /domains/{id}/configurator/compatible/intersection:
    post:
      tags: [ Configurator ]
      summary: Find components compatible with every selected component
      description: |
        Intersects the direct or transitive compatibility sets of all selected active base
        components. Selected base components are excluded from candidates. Each resulting
        component contains compatibility evidence for every base component in componentIds
        request order. Domain components, manual links, enabled automatic rules and the
        compatibility graph are loaded once for the whole request.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguratorIntersectionRequest'
      responses:
        '200':
          description: Success, including an empty intersection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguratorIntersectionResponse'
        '400':
          description: Invalid, duplicate, archived, or out-of-domain base component
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  ###################################
  # CONFIGURATIONS (SAVED BUILDS)
  ###################################

  /domains/{id}/configurations:
    get:
      tags: [ Configurations ]
      summary: List configurations of domain (paged)
      description: |
        Returns only configurations owned by the current user. Results are ordered by createdAt
        descending and then by id descending. An empty page is returned when no configurations exist.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationPage'
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [ Configurations ]
      summary: Create configuration
      description: |
        Atomically saves a non-empty, possibly incomplete build for the current user. Components
        must be active, belong to this domain, have distinct component types and be pairwise
        compatible through manual links or enabled automatic rules. Transitive compatibility is
        not sufficient. The owner is always obtained from the authenticated server context.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConfigurationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid input, duplicate component ids or components from different domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Domain or component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Archived component, repeated component type or incompatible component set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /configurations/{id}:
    get:
      tags: [ Configurations ]
      summary: Get configuration
      description: |
        Returns a configuration owned by the current user. Archived components remain visible and
        are marked with archived=true. A missing or foreign-owned configuration is returned as 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuration not found or not owned by the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [ Configurations ]
      summary: Fully update configuration
      description: |
        Atomically replaces the name, description and complete component set of a configuration
        owned by the current user. Domain, owner and creation time are preserved. The complete
        resulting component set is validated using the same strict rules as configuration creation:
        all components must be active, belong to the configuration domain, have distinct types and
        be pairwise directly compatible. Transitive compatibility is not sufficient. A missing or
        foreign-owned configuration is returned as 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConfigurationRequest'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid input, duplicate component ids or components from different domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuration or component not found, or configuration is not owned by the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Archived component, repeated component type or incompatible component set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [ Configurations ]
      summary: Permanently delete configuration
      description: |
        Permanently deletes a configuration owned by the current user. Component links are removed
        together with the configuration, while catalog components and other configurations remain
        unchanged. A missing, foreign-owned or already deleted configuration is returned as 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Configuration deleted
        '400':
          description: Invalid configuration identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuration not found or not owned by the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /configurations/{id}/export/json:
    get:
      tags: [ Configurations ]
      summary: Export configuration as JSON
      description: |
        Builds a versioned JSON document from the current catalog state. Archived components are
        exported with archived=true. The endpoint is available only to the configuration owner.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Exported JSON
          headers:
            Content-Disposition:
              description: Download filename based on the configuration id
              schema:
                type: string
                example: attachment; filename="configuration-42.json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationExport'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuration not found or not owned by the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
