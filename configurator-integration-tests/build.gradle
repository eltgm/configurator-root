plugins {
    id 'java'
    id 'groovy'
}

def dockerHost = "unix://${System.getProperty('user.home')}/.docker/run/docker.sock"

sourceSets {
    externalTest {
        groovy.srcDir file('src/externalTest/groovy')
        resources.srcDir file('src/externalTest/resources')
        compileClasspath += sourceSets.test.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    externalTestImplementation.extendsFrom testImplementation
    externalTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation project(':configurator')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework:spring-jdbc'
    testImplementation "org.spockframework:spock-core:${spockVersion}"
    testImplementation "org.spockframework:spock-spring:${spockVersion}"
    testImplementation "org.testcontainers:testcontainers-spock:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers-jdbc:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers-postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:${testcontainersVersion}"

    externalTestImplementation 'io.rest-assured:rest-assured:5.5.0'
    externalTestImplementation 'org.apache.groovy:groovy-sql:4.0.24'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
    environment 'DOCKER_HOST', dockerHost
    systemProperty 'DOCKER_HOST', dockerHost
    systemProperty 'docker.host', dockerHost
    environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
}

tasks.register('externalIntegrationTest', Test) {
    description = 'Runs integration tests against an already running service'
    group = 'verification'
    testClassesDirs = sourceSets.externalTest.output.classesDirs
    classpath = sourceSets.externalTest.runtimeClasspath
    useJUnitPlatform()
    environment 'DOCKER_HOST', dockerHost
    systemProperty 'DOCKER_HOST', dockerHost
    systemProperty 'docker.host', dockerHost
    environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
}
