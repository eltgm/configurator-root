spring:
  application:
    name: configurator

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/configurator}
    username: ${DB_USER:configurator}
    password: ${DB_PASSWORD:configurator}
    driver-class-name: org.postgresql.Driver

  jooq:
    sql-dialect: POSTGRES

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  storage:
    component-images:
      endpoint: ${IMAGE_STORAGE_ENDPOINT:http://localhost:9000}
      access-key: ${IMAGE_STORAGE_ACCESS_KEY:minioadmin}
      secret-key: ${IMAGE_STORAGE_SECRET_KEY:minioadmin}
      bucket: ${IMAGE_STORAGE_BUCKET:configurator-components}

server:
  port: 8080
