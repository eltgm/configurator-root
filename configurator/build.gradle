buildscript {
    dependencies {
        classpath 'org.postgresql:postgresql:42.7.3'
    }
}

plugins {
    id 'org.springframework.boot' version '3.4.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'jacoco'
    id 'org.openapi.generator' version '7.11.0'
    id 'org.jooq.jooq-codegen-gradle' version "3.19.28"
}

apply from: "$rootDir/configurator/jooq.gradle"
apply from: "$rootDir/configurator/openapi.gradle"

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.minio:minio:9.0.3'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.13.1'
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'

    implementation "org.flywaydb:flyway-core:11.17.0"
    runtimeOnly "org.flywaydb:flyway-database-postgresql:11.17.0"
    implementation 'org.postgresql:postgresql:42.7.3'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    compileOnly 'org.jetbrains:annotations:26.1.0'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    implementation 'org.mapstruct:mapstruct:1.6.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0'

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.spockframework:spock-core:${spockVersion}"
    testImplementation "org.spockframework:spock-spring:${spockVersion}"
    testImplementation 'org.springframework:spring-jdbc'
    testImplementation 'com.h2database:h2'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archUnitVersion}"

    testImplementation "org.testcontainers:testcontainers-postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:${testcontainersVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('bootJar') {
    archiveFileName = 'configurator.jar'
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate'), tasks.named('jooqCodegen')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport'), tasks.named('jacocoTestCoverageVerification')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }

    def excludedCoveragePatterns = [
            '**/build/**',
            '**/common/util/**',
            '**/domain/**',
            '**/domain/entity/jooq/**',
            '**/api/inbounds/rest/dto/**',
            '**/api/inbounds/rest/*Api*',
            '**/api/ApiUtil*',
            '**/infrastructure/persistence/jooq/config/**'
    ]
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        exclude excludedCoveragePatterns
    })
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')

    def excludedCoveragePatterns = [
            '**/build/**',
            '**/common/util/**',
            '**/domain/**',
            '**/domain/entity/jooq/**',
            '**/api/inbounds/rest/dto/**',
            '**/api/inbounds/rest/*Api*',
            '**/api/ApiUtil*',
            '**/infrastructure/persistence/jooq/config/**'
    ]
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        exclude excludedCoveragePatterns
    })

    violationRules {
        rule {
            limit {
                minimum = 0.90
            }
        }
    }
}
