buildscript {
    dependencies {
        classpath 'org.postgresql:postgresql:42.7.3'
    }
}

plugins {
    id 'org.springframework.boot' version '3.4.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'org.openapi.generator' version '7.11.0'
    id 'org.jooq.jooq-codegen-gradle' version "3.19.28"
}

apply from: "$rootDir/configurator/jooq.gradle"
apply from: "$rootDir/configurator/openapi.gradle"

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation "org.flywaydb:flyway-core:11.17.0"
    runtimeOnly "org.flywaydb:flyway-database-postgresql:11.17.0"
    implementation 'org.postgresql:postgresql:42.7.3'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    implementation 'org.mapstruct:mapstruct:1.6.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0'

    implementation "org.springdoc:springdoc-openapi-ui:1.8.0"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.spockframework:spock-core:2.4-M4-groovy-4.0'
    testImplementation 'org.spockframework:spock-spring:2.4-M4-groovy-4.0'

    testImplementation 'org.testcontainers:postgresql:1.20.2'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate'), tasks.named('jooqCodegen')
}